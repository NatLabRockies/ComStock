# Upgrade subset for the small-sample rerun of sdr_2026r1_all_measure_10k (PLAN.md step 8).
# Drop this list into the owner's run yml in place of the full 65-upgrade block; the upgrade
# names, option strings and order are those of the 2026R1 yml (ids are its 1-based positions),
# so results can be compared with the all-measure run by name. Suggested run settings:
#   - a few hundred buildings (n_datapoints 300-500; the pulled failing ids below are worth
#     forcing in if the sampler allows a buildstock.csv: 112, 148, 195, 345, 1062, 2419, 3145,
#     3701, 4084, 5552, 6252, 7749),
#   - keep_run_folders / the simulation_output tarballs, so each measure's not-applicable
#     messages can be tallied for the applicability comparison (PLAN.md step 10),
#   - buildstock_directory on the commit of ccaradon/spacetype_refactor_measure_failures.
# The owner approves and submits the yml; this file is only the upgrade list.
