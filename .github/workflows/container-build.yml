name: ComStock container builds

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  OPENSTUDIO_VER: '3.10.0'
  OPENSTUDIO_SHA: '86d7e215a1'
  BUILDSTOCK_BATCH_REF: 88dd3b107cf8074acbae282b0ff6f8dfaf8a21e1

jobs:
  check-build-needed:
    # Temporarily skip the workflow; remove this guard to restore conditional builds.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.result }}
    steps:
      - uses: actions/github-script@v8
        id: filter
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              return true;
            }
            if (context.payload.action === 'labeled') {
              return context.payload.label.name === 'ci:containers';
            }

            const pr = context.payload.pull_request;
            if (pr.labels.some(label => label.name === 'ci:containers')) {
              return true;
            }
            if (pr.changed_files > 3000) {
              core.info('Building containers because the PR exceeds GitHub\'s 3,000-file listing limit.');
              return true;
            }

            const inputs = new Set([
              'resources/Gemfile',
              'build/Dockerfile',
              'build/apptainer/Dockerfile',
              '.dockerignore',
              'build/.dockerignore',
              'build/Dockerfile.dockerignore',
              'build/apptainer/Dockerfile.dockerignore',
              '.github/workflows/container-build.yml',
              '.github/scripts/openstudio-docker.sh',
              '.github/scripts/openstudio-sif.sh',
              '.github/scripts/check_baseline_results.py',
              'ymls/bsb-integration-test-baseline.yml',
              'samples/bsb-integration-test.csv',
              'samples/bsb-integration-test-weather.zip',
            ]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.flatMap(file => [file.filename, file.previous_filename])
              .filter(filename => inputs.has(filename));
            core.info(`Changed container inputs: ${changed.join(', ') || 'none'}`);
            return changed.length > 0;

  container-build:
    needs: check-build-needed
    if: needs.check-build-needed.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OPENSTUDIO_EXE: ${{ github.workspace }}/.github/scripts/openstudio-docker.sh
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build image
        run: docker build --file build/Dockerfile --tag comstock-ci .

      - name: Install BuildStockBatch on the runner
        run: python -m pip install "git+https://github.com/NatLabRockies/buildstockbatch.git@${BUILDSTOCK_BATCH_REF}"

      - name: Configure container OpenStudio wrappers
        run: chmod +x .github/scripts/openstudio-docker.sh .github/scripts/openstudio-sif.sh

      - name: Prepare container integration configurations
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          source = Path("ymls/bsb-integration-test-baseline.yml")
          config = yaml.safe_load(source.read_text())
          # The wrappers supply the image's bundled gems, not a host-side bundle.
          config["baseline"]["custom_gems"] = False
          for runtime in ("docker", "sif"):
              config["output_directory"] = f"../{runtime}_baseline_test_output"
              destination = source.with_name(f"bsb-integration-test-{runtime}.yml")
              destination.write_text(yaml.safe_dump(config, sort_keys=False))
          PY

      - name: Check OpenStudio version
        run: |
          version="$("$OPENSTUDIO_EXE" --version)"
          echo "OpenStudio ${version}"
          test "$version" = "${OPENSTUDIO_VER}+${OPENSTUDIO_SHA}"

      - name: Check bundled ComStock gem loads
        run: |
          "$OPENSTUDIO_EXE" -e 'require "comstock-typical"; puts "comstock-typical loaded"'

      - name: Run Docker baseline simulations and host postprocessing
        run: buildstock_local ymls/bsb-integration-test-docker.yml -j 2

      - name: Check every Docker sample building succeeded
        run: |
          python .github/scripts/check_baseline_results.py \
            samples/bsb-integration-test.csv \
            docker_baseline_test_output/simulation_output/results_job0.json.gz

      - name: Build Apptainer builder image
        run: docker build --file build/apptainer/Dockerfile --tag apptainer-ci ./build

      - name: Convert simulation image to SIF
        # Read the local image through the Docker socket; no registry is needed.
        run: |
          docker run --rm --privileged \
            --volume "${GITHUB_WORKSPACE}/build:/root/build" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            apptainer-ci apptainer build /root/build/comstock-ci.sif \
            docker-daemon://comstock-ci:latest

      - name: Check OpenStudio version inside SIF
        env:
          OPENSTUDIO_EXE: ${{ github.workspace }}/.github/scripts/openstudio-sif.sh
        run: |
          version="$("$OPENSTUDIO_EXE" --version)"
          echo "OpenStudio ${version}"
          test "$version" = "${OPENSTUDIO_VER}+${OPENSTUDIO_SHA}"

      - name: Check bundled ComStock gem loads inside SIF
        env:
          OPENSTUDIO_EXE: ${{ github.workspace }}/.github/scripts/openstudio-sif.sh
        run: |
          "$OPENSTUDIO_EXE" -e 'require "comstock-typical"; puts "comstock-typical loaded"'

      - name: Run SIF baseline simulations and host postprocessing
        env:
          OPENSTUDIO_EXE: ${{ github.workspace }}/.github/scripts/openstudio-sif.sh
        run: buildstock_local ymls/bsb-integration-test-sif.yml -j 2

      - name: Check every SIF sample building succeeded
        run: |
          python .github/scripts/check_baseline_results.py \
            samples/bsb-integration-test.csv \
            sif_baseline_test_output/simulation_output/results_job0.json.gz
