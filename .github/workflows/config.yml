name: ComStock tests (draft)

# Allow branch-only testing before this workflow is merged.
on:
  workflow_dispatch:
  push:
    branches: [ci-testing]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENSTUDIO_VER: '3.10.0'
  OPENSTUDIO_SHA: '86d7e215a1'
  OPENSTUDIO_PLATFORM: Ubuntu-24.04-x86_64
  # Pin develop's tip at drafting time so runs use the same BuildStockBatch code.
  # This revision has not been validated for ComStock compatibility.
  # Use 'develop' instead to follow its latest changes on every run.
  BUILDSTOCK_BATCH_REF: 88dd3b107cf8074acbae282b0ff6f8dfaf8a21e1

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/resources/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/.custom_gems
      BUNDLE_WITHOUT: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler: '2.4.10'

      - name: Install official OpenStudio
        run: |
          package="OpenStudio-${OPENSTUDIO_VER}+${OPENSTUDIO_SHA}-${OPENSTUDIO_PLATFORM}.deb"
          curl --fail --location --retry 3 \
            "https://github.com/NatLabRockies/OpenStudio/releases/download/v${OPENSTUDIO_VER}/${package}" \
            --output "${RUNNER_TEMP}/${package}"
          sudo apt-get update
          sudo apt-get install -y "${RUNNER_TEMP}/${package}"
          os_root="/usr/local/openstudio-${OPENSTUDIO_VER}"
          echo "${os_root}/bin" >> "$GITHUB_PATH"
          echo "RUBYLIB=${os_root}/Ruby" >> "$GITHUB_ENV"
          "${os_root}/bin/openstudio" --version

      - name: Install measure dependencies
        run: |
          python -m pip install "numpy<2" GHEDesigner==1.0 NREL-PySAM==4.2.0
          bundle _2.4.10_ install

      - name: Run RuboCop
        run: |
          bundle _2.4.10_ exec rake 'rubocop[true]'
          git diff --exit-code

      - name: Run measure tests through Rake
        id: measure-tests
        run: bundle _2.4.10_ exec rake unit_tests:all_tests

      - name: Check tests actually ran
        if: ${{ !cancelled() && (steps.measure-tests.outcome == 'success' || steps.measure-tests.outcome == 'failure') }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          cases = [case for report in Path("test/reports").glob("**/*.xml")
                   for case in ET.parse(report).getroot().iter("testcase")]
          if not any(case.find("skipped") is None for case in cases):
              raise SystemExit("No executed tests in JUnit reports; check Rake worker execution")
          if any(case.find("failure") is not None or case.find("error") is not None for case in cases):
              raise SystemExit("JUnit reports contain failures or errors")
          PY

      - name: Upload measure test reports
        if: ${{ !cancelled() && (steps.measure-tests.outcome == 'success' || steps.measure-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: measure-test-reports
          path: test/reports/

  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler: '2.4.10'

      - name: Install official OpenStudio
        run: |
          package="OpenStudio-${OPENSTUDIO_VER}+${OPENSTUDIO_SHA}-${OPENSTUDIO_PLATFORM}.deb"
          curl --fail --location --retry 3 \
            "https://github.com/NatLabRockies/OpenStudio/releases/download/v${OPENSTUDIO_VER}/${package}" \
            --output "${RUNNER_TEMP}/${package}"
          sudo apt-get update
          sudo apt-get install -y "${RUNNER_TEMP}/${package}"
          os_exe="/usr/local/openstudio-${OPENSTUDIO_VER}/bin/openstudio"
          echo "$(dirname "$os_exe")" >> "$GITHUB_PATH"
          echo "OPENSTUDIO_EXE=${os_exe}" >> "$GITHUB_ENV"
          "$os_exe" --version

      - name: Install BuildStockBatch and measure Python dependencies
        run: |
          python -m pip install "numpy<2" GHEDesigner==1.0 NREL-PySAM==4.2.0
          python -m pip install "git+https://github.com/NatLabRockies/buildstockbatch.git@${BUILDSTOCK_BATCH_REF}"

      - name: Run baseline simulations and BuildStockBatch postprocessing
        run: buildstock_local ymls/bsb-integration-test-baseline.yml -j 2

      - name: Check every sample building succeeded
        run: |
          python .github/scripts/check_baseline_results.py \
            samples/bsb-integration-test.csv \
            baseline_test_output/simulation_output/results_job0.json.gz

      - name: Extract baseline results CSV
        run: gunzip -k baseline_test_output/results_csvs/results_up00.csv.gz

      - name: Upload baseline results CSV
        uses: actions/upload-artifact@v4
        with:
          name: buildstockbatch-results-csv
          path: baseline_test_output/results_csvs/results_up00.csv
          retention-days: 1
          if-no-files-found: error

      - name: Commit and push baseline results CSV
        if: ${{ github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test/base_results/baseline
          cp baseline_test_output/results_csvs/results_up00.csv test/base_results/baseline/
          git add -- test/base_results/baseline/results_up00.csv
          if ! git diff --cached --quiet -- test/base_results/baseline/results_up00.csv; then
            git -c user.name="GitHub Actions" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Update baseline integration test results [skip ci]" -- test/base_results/baseline/results_up00.csv
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
